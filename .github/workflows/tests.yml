name: Chatbot checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hci_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: hci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hci_test -d hci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HCI_TEST_POSTGRES_URL: postgresql://hci_test:local-ci-test-only@127.0.0.1:5432/hci_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm install --prefix "$RUNNER_TEMP/hci-browser" playwright@1.65.0
      - run: '"$RUNNER_TEMP/hci-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node tools/browser_check.cjs
        env:
          HCI_TEST_PYTHON: python
          NODE_PATH: ${{ runner.temp }}/hci-browser/node_modules
          HCI_BROWSER: ${{ matrix.browser }}
