# Free, temporary team preview. No disk or lasting chat storage.
# App quotas reset on restart; use provider spending controls too.
services:
  - type: web
    name: reassure-guide-team-test
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app.server:application
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEPLOYMENT
        value: render
      - key: CHATBOT_MODE
        value: setup
      - key: STORAGE_MODE
        value: temporary
      - key: ADMIN_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: RESEARCHER_CONTACT
        sync: false
      - key: HUMAN_TEST_REVIEW
        value: pending
      - key: DELETE_DATE
        value: 2026-12-19
      - key: TESTER_DAILY_API_LIMIT
        value: "50"
      - key: GLOBAL_DAILY_API_LIMIT
        value: "250"
      - key: GLOBAL_TOTAL_API_LIMIT
        value: "500"
      - key: TESTER_MINUTE_API_LIMIT
        value: "3"
      - key: GLOBAL_CONCURRENT_API_LIMIT
        value: "5"
      - key: TESTER_DAILY_CHAT_LIMIT
        value: "4"
